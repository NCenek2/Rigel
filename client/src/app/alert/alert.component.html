@if (isAlertActive()) {
  <div
    [class]="'alert text-center fade show alert-container alert-' + alertType()"
    role="alert"
  >
    <div class="alert-description">
      {{ alert() }}
    </div>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
      (click)="hideAlert()"
    ></button>
  </div>
}
